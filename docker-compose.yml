# AIMOS deployment (§23.5, card P5-T8). Paper mode by default; live requires the
# §23.8 go-live ladder + mandate.yaml + withdrawal-disabled keys.
#
# The `aimos` service is ONE process that runs the dashboard + the paper-trading
# loop + Telegram alerts together, sharing one persistent journal. The loop
# auto-starts with the server (FastAPI lifespan) — nothing else to enable.
#   cp .env.example .env   # set TELEGRAM_BOT_TOKEN + features.telegram_enabled=true
#   docker compose up -d   # dashboard on 127.0.0.1:8000, paper loop running, alerts on
services:
  aimos:
    build: .
    command: python -m aimos.runtime.serve   # dashboard + paper loop + Telegram (one process)
    env_file: [.env]
    environment:
      AIMOS__PAPER__JOURNAL_PATH: state/aimos.sqlite   # hash-chained journal (SQLite)
      AIMOS_TIMESCALE_DSN: postgresql://aimos:${POSTGRES_PASSWORD:-aimos}@postgres:5432/aimos
      AIMOS__SAAS__DATABASE_URL: postgresql+psycopg://aimos:${POSTGRES_PASSWORD:-aimos}@postgres:5432/aimos
      AIMOS_SECRETS_DIR: /app/secrets                  # outside dashboard/dist ancestry (REQ-14)
      AIMOS_HOST: 0.0.0.0
      AIMOS_PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]   # never public — behind VPN/SSH tunnel (§23.4)
    volumes: ["./data:/app/data", "./state:/app/state", "./config:/app/config:ro", "secrets:/app/secrets"]
    depends_on: [postgres]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read(); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # INBOUND Telegram commands (/status, /pause) — optional; alerts already come
  # from the `aimos` service above. Enable with: docker compose --profile commands up -d
  telegram-commands:
    build: .
    command: python -m aimos.telegram.bot
    env_file: [.env]
    profiles: ["commands"]
    depends_on: [aimos]
    restart: unless-stopped

  research:
    build: ./services/research    # SEPARATE runtime (§22.2C) — own dep tree
    profiles: ["research"]         # optional; not in the trading runtime env
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:latest-pg16   # TimescaleDB — time-series store (§8.1)
    environment:
      POSTGRES_DB: aimos
      POSTGRES_USER: aimos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimos}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  watchdog:
    build: .
    command: python -m aimos.runtime.watchdog   # heartbeat; 3× miss → restart + alert
    depends_on: [aimos]
    volumes: ["./state:/app/state"]
    restart: unless-stopped

volumes:
  pgdata:
  secrets:
