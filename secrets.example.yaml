# AIMOS per-venue API secrets (Phase D). Copy to a private path, point
# AIMOS_SECRETS_FILE at it (e.g. AIMOS_SECRETS_FILE=/run/secrets/aimos.yaml),
# and restart. Keys are used ONLY for account access (balances, live orders) —
# never for market-data analysis. The startup preflight authenticates each key
# read-only (fetch_balance), verifies withdrawals are DISABLED, and reports on the
# Connections screen. NO orders are placed by the preflight.
#
# Keys MUST have withdrawals disabled (§23.4). Paper trading + price monitoring
# need NO keys — leave this unset for those.
#
# Precedence: this file wins; otherwise per-venue env vars are the fallback:
#   AIMOS_KEY_BINANCE / AIMOS_SECRET_BINANCE, AIMOS_KEY_KRAKEN / ..., etc.
venues:
  binance:
    apiKey: "REPLACE_ME"
    secret: "REPLACE_ME"
    withdraw: false        # must be false — a key that can withdraw is refused
  kraken:
    apiKey: "REPLACE_ME"
    secret: "REPLACE_ME"
    withdraw: false
  coinbase:
    apiKey: "REPLACE_ME"
    secret: "REPLACE_ME"
    withdraw: false
