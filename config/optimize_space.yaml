# Optuna threshold-optimization search space (§21.4). Output = PROPOSAL only,
# never a direct config write. ≤ 8 parameters per study.

max_params_per_study: 8
objective: nested_walkforward_oos_sharpe   # never in-sample
plateau_tolerance_pct: 5                    # trials within % of best are "plateau"
perturbation_pct: 10                        # ±% robustness check for plateau pick

# Declared tunables (name → [low, high]); a study selects ≤ 8 of these.
space:
  execution.base_risk_pct: [0.1, 1.0]
  execution.min_trade_score: [0.30, 0.60]
  execution.max_cost_fraction: [0.15, 0.35]
  intelligence.min_confidence: [0.25, 0.50]
  intelligence.bayes_likelihood_lift: [0.20, 0.50]
  intelligence.direction_bias.bull: [0.52, 0.65]
  tiers.promote: [55, 75]
  tiers.demote: [40, 55]
