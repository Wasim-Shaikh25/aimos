# Single-admin auth + encrypted settings store configuration.
# No paid third-party services are used by AIMOS itself. The operator may supply
# SMTP credentials so login OTPs can be emailed; if SMTP is absent, the code is
# written to state/maildrop/ for local development.

enabled: false                    # master SaaS feature flag (also mirrored in default.yaml features.saas_enabled)

# Auth database. Defaults to sqlite:///state/auth.sqlite when empty.
database_url: ""                  # e.g. "sqlite:///state/auth.sqlite" or "postgresql://..."

# JWT tokens
jwt_secret: ""                    # auto-generated from a random 32-byte value when empty (logged once)
access_token_expire_minutes: 15
refresh_token_expire_days: 30
otp_expire_minutes: 10            # login one-time code lifetime

# SMTP for sending the login OTP to the admin email (operator-supplied).
smtp:
  host: ""                        # e.g. smtp.gmail.com or a self-hosted Postfix
  port: 587
  username: ""
  password: ""                    # env override AIMOS__SAAS__SMTP__PASSWORD
  use_tls: true
  from_address: "noreply@aimos.local"

# Single admin user seeded at startup (no public registration).
# Override with env vars AIMOS__SAAS__ADMIN__USER_ID / __EMAIL / __PHONE / __PASSWORD.
admin:
  user_id: "admin"
  email: ""
  phone: ""
  password: ""                    # hashed on first run; never logged or returned

# Tenant / runtime scoping (legacy paths used for the single admin organization).
tenant:
  allow_multiple_orgs_per_user: false
  default_org_name: "Personal"
  journal_dir: "state/journals"     # per-tenant journal stored at <journal_dir>/<org_id>.sqlite
  state_dir: "state/tenants"        # per-tenant runtime state
