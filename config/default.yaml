# AIMOS runtime configuration (§12, §16.4, §23.12).
# Every value here is an INITIAL value, not a constant to inline in code
# (§23.12 retro-fit note). Each key: meaning · unit · sane range.

# NOTE (v1.2): the static symbol list below is ONLY for Phases 0-4 (development,
# engine fixtures, recorded-data backtests on deep markets). From Phase 1.5 the
# live symbol set comes from the Universe Manager (§16.1). BTC/ETH remain the
# canonical dev/backtest fixture assets.
dev_symbols: [BTC/USDT, ETH/USDT]   # dev/backtest fixtures only · list
base_timeframe: 5m                  # decision cadence · enum(1m,5m,15m,1h,4h,1d)
analysis_timeframes: [5m, 15m, 1h, 4h]   # engines run on each · list
horizon_minutes: 240                # forecast horizon · minutes · [5, 10080]

universe:
  ref: universe.yaml                # §16.1 — Universe Manager owns the live set

exchanges:
  primary: binance
  secondary: [bybit, kraken]

tiers:                              # §16.1D / §16.4
  t1_max: 12                        # max Tier-1 active assets · [1, 24]
  t2_max: 60                        # max Tier-2 watch assets · [1, 200]
  t1_provisional_max: 3             # ignition fast-track slots (§23.11) · [0, 8]
  promote: 65                       # opportunity_score to enter T1 · [0, 100]
  demote: 50                        # opportunity_score to exit T1 · [0, 100]
  demote_scans: 3                   # consecutive sub-threshold scans to demote · [1, 20]

intelligence:
  direction_bias:
    bull: 0.58                      # p_up >= bull → BULLISH bias · [0.5, 1.0]
    bear: 0.42                      # p_up <= bear → BEARISH bias · [0.0, 0.5]
  min_confidence: 0.35              # below → evaluator forces NO_TRADE (§6.7) · [0, 1]
  p_up_clip: [0.05, 0.95]           # rule-engine p_up clamp (§6.1) · sub-range of [0,1]
  bayes_likelihood_lift: 0.35       # max multiplicative tilt per evidence (§6.2) · [0, 1]
  correlation_guard_keep: 2         # strongest N same-engine evidences kept full (§6.2) · [1, 10]
  ml_model_path: ""                 # trained ML artifact (scripts/train_from_history --out);
                                    # empty → ML engine inert. env AIMOS__INTELLIGENCE__ML_MODEL_PATH
  fusion_weights:                   # base engine weights (§6.4) · each [0, 1]
    rule: 0.45
    bayes: 0.45
    ml: 0.0                         # inert until §8 proves live calibration. Raise ONLY after
                                    # a trained model clears the gate (train_from_history) + shadow
  tf_weights:                       # §25.2 timeframe reliability multipliers
    1m: 0.6
    5m: 0.6
    15m: 0.8
    1h: 1.0
    4h: 1.1
  conflict:                         # §6.4 conflict penalties
    disagreement_threshold: 0.25    # max pairwise |p_up_i - p_up_j| · [0, 1]
    disagreement_conf_mult: 0.6     # confidence multiplier on disagreement · [0, 1]
    liquidity_conf_mult: 0.7        # confidence multiplier on poor liquidity · [0, 1]
    liquidity_spread_z: 2.0         # spread z above → poor liquidity · z
    sentiment_book_shift: 0.15      # mass shifted to UNCLEAR on sentiment/book conflict · [0, 1]
    headline_shock_conf_mult: 0.5   # confidence multiplier on headline_shock · [0, 1]
    headline_shock_pull: 0.5        # fraction p_up pulled toward 0.5 · [0, 1]
    tf_conflict_disagreement: 0.3   # synthetic disagreement for cross-TF structure conflict · [0, 1]
  bayes_prior: [0.34, 0.33, 0.33]   # §6.2 prior over (up, down, flat) · sums to 1
  regime_tf: 1h                     # §6.1.2 regime rules evaluated on this TF's evidence
  rule:                             # §6.1 rule-engine constants
    regime_onehot_matched: 0.7      # prob mass on the matched regime (rest spread) · [0, 1]
    behavior_matched: 0.7           # prob mass on matched behavior · [0, 1]
    behavior_unclear_default: 0.6   # prob on UNCLEAR when nothing matches · [0, 1]
    confidence_cap: 0.85            # rules never claim near-certainty · [0, 1]
    fired_strength_min: 0.5         # rules with strength > this count toward confidence
  coverage_engines: 13              # §25.7 evidence_coverage denominator (full profile)
  explain_top_n: 8                  # §6.8 top-N reasons in MarketUnderstanding
  scores:                           # §6.6 scorer inputs; history-dependent inputs
                                    # default here when Layer 2 can't see candle
                                    # history (§25.3) — pipeline may override.
    manipulation_behavior_threshold: 0.3   # MANIPULATION prob > this → high manip risk
    default_liquidity_q: 65         # depth percentile default (no 30d history) · [0,100]
    thin_book_q: 20                 # liquidity_q when thin_book flagged · [0,100]
    default_volume_q: 65            # 24h-volume percentile default · [0,100]
    default_exchange_q: 90          # exchange_q when venue unknown · [0,100]
    default_vol_percentile: 40      # ATR% percentile default · [0,100]
    default_liquidity_risk: 30      # liquidity risk component default · [0,100]
    default_portfolio_component: 0  # from Layer 3 (0 in isolated L2) · [0,100]
    regime_alignment_agree: 100     # direction agrees regime trend · [0,100]
    regime_alignment_ranging: 50    # ranging regime · [0,100]
    regime_alignment_conflict: 0    # direction conflicts regime · [0,100]
    rr_scale: 25                    # rr_potential = dist/ATR × scale, capped 100
    spread_risk_z: 2.0              # spread z above → high liquidity risk

execution:
  min_trade_score: 0.45             # winner below → NO_TRADE (§7.3) · [0, 1]
  no_trade_baseline: 0.30           # RiskOff baseline score (§7.3) · [0, 1]
  base_risk_pct: 0.5                # per-trade risk (§7.5) · percent · (0, 1.0]
  confidence_scale_range: [0.5, 1.5]  # sizer confidence clamp (§7.5) · multiplier
  confidence_scale_pivot: 0.6       # confidence/pivot → scale (§7.5) · [0, 1]
  max_portfolio_heat_pct: 2.0       # Σ open-position risk cap (§7.4) · percent · (0, 10]
  max_positions: 4                  # concurrent positions (§7.4) · [1, 50]
  max_per_symbol: 1                 # positions per symbol (§7.4) · [1, 10]
  max_correlated_bucket_pct: 1.0    # risk per corr>0.8 bucket (§7.4) · percent
  correlation_bucket_threshold: 0.8 # pairwise 30-bar corr for one bucket · [0, 1]
  daily_stop_pct: 2.0               # day PnL stop → NO_TRADE till next UTC day · percent
  risk_score_veto: 80               # risk_score above → veto all but RiskOff/SmartDCA · [0, 100]
  ev_norm_cap_r: 2.0                # ev_normalized saturation in R (§25.5) · [0.5, 10]
  cost_probe_size_usdt: 1000        # nominal size for plugin slippage probe (§25.4) · usd
  max_cost_fraction: 0.25           # reject if costs > frac × gross move (§23.9C) · [0, 1]
  losing_trade_r: 1.0               # loss assumed in EV when SL hit (§7.3) · R
  eval_weights:                     # §7.3 evaluator score composition · sum to 1
    ev: 0.40
    confidence: 0.25
    opportunity: 0.20
    risk: 0.15

runtime:
  orderbook_poll_seconds: 10        # §4.2 book poll cadence · seconds · [1, 120]
  funding_poll_minutes: 5           # §4.3 funding/OI cadence · minutes · [1, 60]
  heavy_engine_cache_ticks: 3       # cache correlation/cross-exchange N ticks (§10.1) · [1, 20]
  bos_recency_bars: 3               # "BOS just fired" window (§25.3) · bars · [1, 20]
  compression_recency_bars: 10      # "vol_compression recent" window (§25.3) · bars · [1, 50]
  clock_drift_warn_ms: 500          # NTP drift warn (§23.3) · ms
  clock_drift_pause_ms: 2000        # NTP drift → pause new entries (§23.3) · ms

# --- Phase 1 data infrastructure (§4, §23.2, §23.3) ---
ratelimit:                          # §23.2 rate-limit budgeter
  utilization_ceiling: 0.70         # start at % of published limit · (0, 1]
  ceiling_halve_hours: 1            # halve ceiling for N h after 429/418 · hours
  backoff_base_seconds: 1.0         # exponential backoff base · seconds
  backoff_max_seconds: 60.0         # backoff cap · seconds
  # priority: orders > position/balance > orderbook > candles > discovery
  priority_classes: [orders, position, orderbook, candles, discovery]
  default_window_seconds: 60        # token-bucket refill window · seconds

data:                               # §4 fetch/store parameters
  candle_page_limit: 1000           # OHLCV per fetch page · [1, 1500]
  history_depth_candles: 2000       # default backfill depth · candles
  book_depth_pct: 0.5               # depth measured within % of mid (§4.2) · percent
  book_window_snapshots: 360        # rolling in-memory snapshots (1h at 10s) · count
  large_print_min_usd: 250000       # single-print threshold (§5.8) · usd
  large_print_window_minutes: 60    # net large-print flow window · minutes
  fear_greed_url: "https://api.alternative.me/fng/?limit=30"   # §4.4
  rss_feeds:                        # §4.4 headline sources
    - "https://www.coindesk.com/arc/outboundfeeds/rss/"
    - "https://cointelegraph.com/rss"

data_quality:                       # §23.3 data quality gate
  bad_tick_atr_mult: 8.0            # price dev > N×ATR from last valid → suspect · mult
  second_venue_confirm_seconds: 2   # ...unconfirmed by 2nd venue within N s → quarantine
  cross_venue_max_deviation_pct: 3.0   # primary mid vs median of others → degraded · percent
  staleness_cadence_mult: 2.0       # feed older than N× cadence → stale · mult

# --- Phase 6 learning (§6.3, §8.2-8.4, §23.7) ---
learning:
  triple_barrier:                   # §8.2
    upper_atr: 1.5
    lower_atr: 1.5
    noise_atr: 0.3
  ml:                               # §6.3, §8.3
    min_labeled_samples: 2000       # before training is allowed
    val_auc_min: 0.55               # promotion gate
    shadow_weeks: 2                  # shadow-mode duration before weight raise
    lgbm: {num_leaves: 31, n_estimators: 400, learning_rate: 0.05, min_child_samples: 50}
  calibration:                      # §8.4
    reliability_clamp: [0.2, 0.9]   # rel_new = clamp(2·hitrate − 0.5, lo, hi)
    hitrate_move_atr: 0.5           # "moved beyond 0.5×ATR within horizon"
  drift:                            # §23.7
    psi_threshold: 0.25             # PSI > this on > frac of features → retrain proposal
    psi_feature_frac: 0.20
    brier_degradation: 0.20         # > this → auto-halve ML fusion weight
  history:                          # train the ML on OLDER data via paper replay
    enabled: false                  # master switch for scripts/train_from_history
                                    # (env AIMOS__LEARNING__HISTORY__ENABLED=true)
    horizon_bars: 24                # triple-barrier forward window · bars
    warmup: 200                     # bars skipped before the first labelled decision
    n_folds: 3                      # walk-forward validation folds

mode: paper                         # paper | live — live requires §23.8 gate ladder

# --- Deployment feature flags (toggle subsystems on/off) ---
# Paper trading needs NO exchange API keys — it reads PUBLIC market data and
# fills against the simulated PaperBroker. Only Telegram (optional) and the LLM
# news sensor (optional) consume secrets, supplied via env vars (never in files).
features:
  telegram_enabled: false           # true + TELEGRAM_BOT_TOKEN env → send messages
  llm_news_sensor: false            # §19 — needs ANTHROPIC_API_KEY when true
  scalp_enabled: true               # §17 — minute-scale scalping (post-only). Registers
                                    # MomentumScalp + the proxy micro-engine; fires only on
                                    # volume-spike + book-imbalance + direction agreement
  live_data: true                   # true → fetch live PUBLIC candles (no keys);
                                    # false → offline synthetic data (fully self-contained run)
  cross_exchange_enabled: false     # §5.11/§7.2 P8 — populate venue_snapshot across
                                    # paper.cross_venues so price_dislocation + the
                                    # CrossExchangeArb plugin (also enable it) run
  multi_venue_live: false           # Phase D — route arb legs to LIVE per-venue brokers
                                    # (needs mandate + per-venue keys; §23.8 go-live ladder)
  streaming_enabled: false          # Phase 3 — public websocket top-of-book/trades/ticker feed
  saas_enabled: false               # SaaS v2.0 — user registration, auth, multi-tenancy

# Phase 3 — websocket feed tuning (only used when features.streaming_enabled is true)
streaming:
  book_window_minutes: 1.0
  trade_window_minutes: 5.0
  min_notional_usd: 100.0
  max_recent_trades: 1000

# Phase D — account access. Keys are ONLY used here (never for analysis). See §2.
account:
  preflight_on_start: true          # read-only connectivity self-check at startup (no orders)
  require_withdrawal_disabled: true # refuse to trade a venue whose key can withdraw (§23.4)
secrets:
  file: ""                          # AIMOS_SECRETS_FILE path (yaml); env vars are the fallback

paper:
  use_universe: true                # true → analyze the discovered/seeded universe (top-N by
                                    # volume); false → just the `symbols` dev set below
  max_symbols: 40                   # top-N bases analyzed per tick when use_universe (§16.1 tiers)
  universe_refresh_ticks: 60        # rebuild the universe every N ticks (rediscovery cadence)
  symbols: [BTC/USDT, ETH/USDT]     # dev fallback set when use_universe: false
  data_exchange: binance            # PUBLIC data venue (no API keys needed)
  cross_venues: [binance, kraken]   # venues sampled for cross-exchange top-of-book (§5.11)
  timeframe: 1h                     # candle timeframe for the loop
  loop_seconds: 300                 # tick cadence · seconds
  history_bars: 400                 # warmup candles fetched per tick
  starting_equity_usdt: 10000
  max_ticks: 0                      # 0 = run forever; >0 = stop after N ticks (for a bounded run)
  journal_path: "state/aimos.sqlite"  # SHA-256 hash-chained decision journal (SQLite).
                                    # "" = in-memory (lost on restart). Default persists.
  telegram_status_ticks: 0          # >0 → send a Telegram status summary every N ticks
                                    # (trade-open/close/risk alerts fire regardless when enabled)

# Storage. The SQLite journal (paper.journal_path) is always the tamper-evident
# record. TimescaleDB is an OPTIONAL time-series store for equity/decisions/prices/
# trades — enabled only when a DSN is set (env AIMOS_TIMESCALE_DSN overrides) and
# psycopg is installed; otherwise it is a safe no-op.
storage:
  timescale_dsn: ""                 # e.g. postgresql://aimos:aimos@postgres:5432/aimos

# Feature monitor agent — a background self-tester that probes every feature on an
# interval, writes a coverage report (state/monitor_report.json, /api/monitor,
# Monitor screen), and can FORCE the safe keyless flags (cross_exchange, scalp) on
# so every code path is exercised fast. Never touches live/funded features.
monitor:
  enabled: false                    # true → run the monitor loop in `serve`
  force_coverage: true              # enable cross_exchange + scalp once, to exercise them
  interval_seconds: 20              # how often to re-probe and republish the report

# Risk analytics (VaR/ES, alpha/beta, BTC-beta factor split) — cached daily (REQ-1)
risk:
  enabled: true                   # env `AIMOS__RISK__ENABLED=false` to disable
  interval_seconds: 86400         # daily recompute; env `AIMOS__RISK__INTERVAL_SECONDS`
  timeframe: ""                   # fallback to `paper.timeframe` when empty
  min_samples: 30                 # minimum equity-return samples before computing metrics

# Health/readiness probes (REQ-6). `/readyz` becomes 200 only after the paper loop
# has written a heartbeat fresher than `heartbeat_stale_seconds` and the journal
# is writable. `/healthz` is always 200 when the process responds.
health:
  heartbeat_stale_seconds: 30      # env `AIMOS__HEALTH__HEARTBEAT_STALE_SECONDS`

# Read-only AI analyst (specs/ASSISTANT.md) — answers questions and writes reports
# grounded in the journal + metrics. LLM is a sensor/explainer only (§15.3): it
# never trades, flips flags, or edits config. Off unless enabled + ANTHROPIC_API_KEY.
assistant:
  enabled: false                    # master switch (env AIMOS__ASSISTANT__ENABLED=true)
  provider: anthropic               # anthropic | openai — which LLM backend to use
  model: claude-sonnet-5            # Anthropic model id (used when provider: anthropic)
  openai_model: gpt-4o-mini         # OpenAI model id (used when provider: openai; cheap)
  max_tokens: 1200                  # response cap
  temperature: 0.2                  # low — analysis, not creativity
  recent_decisions: 40              # decisions pulled into the grounding bundle
  timeout_seconds: 40               # LLM call timeout · seconds
  # keys: ANTHROPIC_API_KEY (anthropic) or OPENAI_API_KEY (openai) — env only, never in files
