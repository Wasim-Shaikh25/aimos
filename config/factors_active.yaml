ir_min: 0.3                  # and IR ≥ this
max_active: 20               # cap at top N by IC
cluster_corr_max: 0.7        # pre-cluster: >this corr → keep highest-IC of cluster
alphas: []                   # list of {id, zoo, ic_sign} — populated by selection job
