# P8 CrossExchangeArb (§7.2 P8, §5.11). regimes: any (market-neutral).
# Disabled by default — cross-venue trading needs dual-venue balances (Phase 3)
# and a populated venue_snapshot. Enable with features.cross_exchange_enabled.
enabled: false
min_confidence: 0.0          # arb is data-driven, not regime/confidence gated
min_coin_health: 0.0
extra_margin_bps: 4          # dislocation must clear costs + this safety margin (§7.2 P8)
stop_bps: 10                 # convergence-failure stop distance (tight — spread should converge)
hold_minutes: 15             # expected time for the spread to converge
arb_confidence: 0.85         # a locked two-leg spread converges with high probability
